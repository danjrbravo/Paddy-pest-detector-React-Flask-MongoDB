services:

  # MongoDB
  mongodb:
    image: mongo:latest
    restart: unless-stopped

    volumes:
      - mongo_data:/data/db

    networks:
      - pest_net

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend Flask
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "5000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/best.pt:/app/best.pt:ro
      - uploads_data:/app/static/uploads
      - results_data:/app/static/results

    networks:
      - pest_net

    depends_on:
      mongodb:
        condition: service_healthy

  # Frontend React + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    restart: unless-stopped

    expose:
      - "80"

    networks:
      - pest_net

    depends_on:
      - backend


# ── Volúmenes ───────────────────────────────────────────────
volumes:
  mongo_data:
  uploads_data:
  results_data:


# ── Red interna ─────────────────────────────────────────────
networks:
  pest_net:
    driver: bridge